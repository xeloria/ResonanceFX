#
# Push a tag matching module/module.prop's version (e.g. v2.0.0) to build and publish a release.
# Optional secrets for a stable app signature (recommended, otherwise updates need a reinstall):
#   RFX_KEYSTORE_BASE64, RFX_KEYSTORE_PASSWORD, RFX_KEY_ALIAS, RFX_KEY_PASSWORD
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018
  CMAKE_VERSION: 3.22.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3

      - name: Check the tag matches the module version
        run: |
          version="$(sed -n 's/^version=//p' module/module.prop)"
          app="v$(sed -n 's/.*versionName = "\(.*\)"/\1/p' app/app/build.gradle.kts)"
          echo "tag=$GITHUB_REF_NAME module=$version app=$app"
          [ "$GITHUB_REF_NAME" = "$version" ] && [ "$GITHUB_REF_NAME" = "$app" ]

      - name: Install NDK and CMake
        run: sdkmanager --install "ndk;${NDK_VERSION}" "cmake;${CMAKE_VERSION}" > /dev/null
      - name: Build engine and module
        run: |
          ANDROID_SDK="$ANDROID_HOME" bash scripts/build-engine.sh
          bash scripts/build-module.sh

      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.RFX_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RFX_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No RFX_KEYSTORE_BASE64 secret: the APK is signed with a throwaway debug key."
          fi
      - name: Build app
        working-directory: app
        env:
          RFX_KEYSTORE_PASSWORD: ${{ secrets.RFX_KEYSTORE_PASSWORD }}
          RFX_KEY_ALIAS: ${{ secrets.RFX_KEY_ALIAS }}
          RFX_KEY_PASSWORD: ${{ secrets.RFX_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/app/build/outputs/apk/release/app-release.apk "out/ResonanceFX-$GITHUB_REF_NAME.apk"
          (cd out && sha256sum "ResonanceFX-$GITHUB_REF_NAME.zip" "ResonanceFX-$GITHUB_REF_NAME.apk" > SHA256SUMS.txt)
          notes="$(awk -v v="## $GITHUB_REF_NAME" '$0 ~ "^## " { p = index($0, v) == 1; next } p' CHANGELOG.md)"
          gh release create "$GITHUB_REF_NAME" --title "ResonanceFX $GITHUB_REF_NAME" \
            --notes "${notes:-See CHANGELOG.md}" \
            "out/ResonanceFX-$GITHUB_REF_NAME.zip" "out/ResonanceFX-$GITHUB_REF_NAME.apk" out/SHA256SUMS.txt
